<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CITYOS — Smart Energy Command Center</title>
  <style>
    :root{--bg:#07131d;--surface:#0d1d29;--surface2:#112633;--line:#1d3949;--text:#eef7f7;--muted:#93abb7;--cyan:#30d5c8;--blue:#4b9eff;--yellow:#ffc55a;--red:#ff6969;--green:#53d58c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);background:#091924;padding:24px 14px;position:sticky;top:0;height:100vh}.brand{padding:0 12px 24px;font-weight:800;font-size:22px;letter-spacing:1.5px}.brand small{display:block;color:var(--cyan);font-size:10px;letter-spacing:2px;margin-top:4px}.nav-title{color:#5d8190;text-transform:uppercase;letter-spacing:1px;font-size:10px;margin:18px 12px 7px}.nav button{width:100%;border:0;border-radius:8px;background:transparent;color:#aec1ca;text-align:left;padding:10px 12px;margin:1px 0;cursor:pointer;font:inherit}.nav button:hover,.nav button.active{background:#133343;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--cyan)}.main{min-width:0}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 30px;position:sticky;top:0;background:rgba(7,19,29,.95);z-index:3}.search{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:11px 14px;color:#90abb6;min-width:280px}.live{margin-left:auto;color:var(--cyan);font-size:12px;font-weight:700}.dot{display:inline-block;width:8px;height:8px;background:var(--cyan);border-radius:50%;box-shadow:0 0 12px var(--cyan);margin-right:7px}.demo{border:1px solid #82652f;color:var(--yellow);padding:5px 9px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:1px}.clock{color:var(--muted)}main{padding:30px;max-width:1600px;margin:auto}.crumb{font-size:12px;color:var(--muted);margin-bottom:12px}.crumb a{color:var(--cyan);cursor:pointer}.heading{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:26px}.heading h1{font-size:27px;margin:0}.heading p{color:var(--muted);margin:7px 0 0}.cards{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:13px}.card,.panel{border:1px solid var(--line);background:linear-gradient(135deg,var(--surface),#0a1a25);border-radius:10px}.card{padding:16px}.label{color:var(--muted);font-size:12px}.value{font-size:25px;font-weight:750;margin-top:8px}.trend{font-size:11px;color:var(--green);margin-top:7px}.grid{display:grid;grid-template-columns:1.3fr .9fr;gap:16px;margin-top:16px}.panel{padding:19px}.panel h2{font-size:15px;margin:0 0 17px}.panel h3{font-size:13px;margin:0}.chart{height:220px;display:flex;align-items:end;gap:5px;padding-top:10px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 53px,#193541 54px)}.bar{flex:1;background:linear-gradient(180deg,var(--cyan),#167c91);border-radius:3px 3px 0 0;opacity:.9;min-width:6px}.bar.c{background:linear-gradient(180deg,var(--yellow),#cc7d35);opacity:.65}.legend{display:flex;gap:15px;color:var(--muted);font-size:12px;margin-top:12px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cyan);margin-right:5px}.legend .cons{background:var(--yellow)}.flow{display:flex;align-items:center;justify-content:space-between;gap:5px;min-height:195px;text-align:center}.node{border:1px solid #286176;background:#0b2530;border-radius:8px;padding:12px 8px;min-width:90px;color:#ccf7f2;font-size:12px}.node b{display:block;color:white;margin-top:5px}.arrow{color:var(--cyan);font-size:23px}.alert{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.badge{font-size:10px;font-weight:800;border-radius:12px;padding:4px 7px;height:max-content}.critical{background:#4d2229;color:#ff9292}.high{background:#4b3520;color:#ffd28d}.medium{background:#21394a;color:#85c8ff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.7px;text-align:left;color:#7594a0;padding:10px;border-bottom:1px solid var(--line)}.table td{padding:13px 10px;border-bottom:1px solid #17323e;color:#c7d9df}.table tr{cursor:pointer}.table tr:hover{background:#102936}.status{font-size:11px;color:var(--green)}.status.off{color:var(--red)}.btn{background:var(--cyan);border:0;border-radius:7px;padding:9px 12px;color:#062027;font-weight:800;cursor:pointer}.btn.ghost{background:transparent;border:1px solid #315161;color:#cce6e9}.buttons{display:flex;gap:8px;flex-wrap:wrap}.map{height:380px;border-radius:8px;background:radial-gradient(circle at 58% 48%,#143e48 0 2px,transparent 3px),radial-gradient(circle at 35% 62%,#d9ab44 0 5px,transparent 6px),radial-gradient(circle at 48% 38%,#30d5c8 0 7px,transparent 8px),linear-gradient(135deg,#102d38,#0d2230);position:relative;overflow:hidden}.map:before{content:"TUNISIE — DONNÉES SIMULÉES";position:absolute;inset:0;display:grid;place-items:center;color:#6d919b;letter-spacing:3px;font-size:18px;transform:rotate(-18deg)}.marker{position:absolute;border-radius:50%;width:14px;height:14px;background:var(--cyan);box-shadow:0 0 0 5px #30d5c833;cursor:pointer}.marker.pv{background:var(--yellow)}.marker.alertm{background:var(--red)}.detail{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}.metric{padding:13px;background:#0b202b;border-radius:7px}.metric strong{display:block;font-size:20px;margin-top:5px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:10}.modal.show{display:grid}.dialog{width:min(460px,calc(100vw - 34px));background:#102530;border:1px solid #31505d;border-radius:12px;padding:25px;box-shadow:0 22px 60px #000}.dialog h2{margin:0 0 10px}.dialog p{color:var(--muted);line-height:1.5}.toast{position:fixed;right:24px;bottom:24px;background:#163a36;border:1px solid var(--green);padding:14px 18px;border-radius:8px;display:none;z-index:11}.toast.show{display:block}.tabs{display:flex;gap:8px}.tabs button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 10px;border-radius:5px;cursor:pointer}.tabs button.sel{background:#174151;color:#fff}.empty{color:var(--muted);padding:26px;text-align:center}@media(max-width:1000px){.app{grid-template-columns:70px 1fr}.side{padding:20px 7px}.brand{font-size:0;padding:0 8px 18px}.brand:first-letter{font-size:22px}.brand small,.nav-title{display:none}.nav button{font-size:0;text-align:center;padding:12px}.nav button:first-letter{font-size:15px}.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:640px){.app{display:block}.side{position:static;height:auto;display:flex;overflow:auto}.nav{display:flex}.nav button{white-space:nowrap}.top{padding:0 14px}.search{display:none}.clock{display:none}main{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.flow{flex-wrap:wrap}.detail{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body><div class="app"><aside class="side"><div class="brand">CITYOS<small>SMART ENERGY</small></div><nav class="nav" id="nav"></nav></aside><div class="main"><header class="top"><div class="search">⌕ &nbsp; Search assets, meters, districts…</div><div class="live"><span class="dot"></span>LIVE SIMULATION</div><div class="demo">DEMO / SIMULATION</div><div class="clock" id="clock"></div><div>🔔 <span id="notif">7</span></div><div>◉ Operator</div></header><main id="content"></main></div></div>
<div class="modal" id="modal"><div class="dialog"><h2 id="modalTitle">Confirm simulation</h2><p id="modalText"></p><div class="buttons"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="confirmCommand()">Confirm Simulation</button></div></div></div><div class="toast" id="toast"></div>
<script>
const plants=[['Centrale Tunis','Thermal','148 MW','94%','tunis'],['Centrale Nord','Wind','62 MW','98%','north'],['Centrale Centre','Hydro','41 MW','91%','centre'],['Centrale Sud','Thermal','76 MW','96%','south'],['Centrale Sousse','Thermal','55 MW','93%','sousse']];
const pvPlants=[['PV Centrale Nord','32 MWp','21.8 MW','97.4%'],['PV Centrale Centre','24 MWp','16.1 MW','96.1%'],['PV Centrale Sud','38 MWp','25.4 MW','93.2%']];
const houses=[['M-001245','Cité El Amal','SM-001245',true,4.2,5.8,'Online'],['M-001246','Cité El Amal','SM-001246',false,5.2,0,'Online'],['M-001247','Cité El Amal','SM-001247',true,5,2,'Online'],['M-001248','Cité Ennasr','SM-001248',true,7.3,0,'Offline'],['M-001249','Cité Carthage','SM-001249',false,6.5,0,'Online'],['M-001250','Cité El Amal','SM-001250',true,3.6,4.9,'Online']];
let operations=[['14:32','Operator','House M-001245','Remote Read','Success'],['14:29','Operator','District Tunis Nord','Diagnostics','Success'],['14:25','Manager','PV Centrale Sud','Status Request','Success']];let target='',command='';
const nav=[['Overview','overview'],['Infrastructure','label'],['Centrales','centrals'],['Districts','district'],['Cités','city'],['Maisons','houses'],['Energy','label'],['Solar','solar'],['Grid Map','map'],['Operations','label'],['Alerts','alerts'],['Remote Control','control'],['Operations Log','operations']];
function navDraw(active){document.getElementById('nav').innerHTML=nav.map(x=>x[1]=='label'?`<div class="nav-title">${x[0]}</div>`:`<button class="${active==x[1]?'active':''}" onclick="route('${x[1]}')">${x[0]}</button>`).join('')}
function route(page,id){navDraw(page);const c=document.getElementById('content');if(page==='overview')c.innerHTML=overview();else if(page==='centrals')c.innerHTML=centrals();else if(page==='central')c.innerHTML=central();else if(page==='district')c.innerHTML=district();else if(page==='city')c.innerHTML=city();else if(page==='houses')c.innerHTML=houseList();else if(page==='house')c.innerHTML=house(id||0);else if(page==='meter')c.innerHTML=meter();else if(page==='solar')c.innerHTML=solar();else if(page==='map')c.innerHTML=map();else if(page==='alerts')c.innerHTML=alerts();else if(page==='operations')c.innerHTML=ops();else c.innerHTML=control();}
const head=(title,sub='Supervision énergétique simulée')=>`<div class="crumb"><a onclick="route('overview')">Overview</a> / ${title}</div><div class="heading"><div><h1>${title}</h1><p>${sub}</p></div></div>`;
const card=(label,val,trend='Live data')=>`<div class="card"><div class="label">${label}</div><div class="value">${val}</div><div class="trend">↗ ${trend}</div></div>`;
function bars(){let a=[28,33,42,52,61,70,77,86,91,84,78,75,69,62,59,61,68,74,83,88,79,62,50,37];return `<div class="chart">${a.map((x,i)=>`<div class="bar" style="height:${x}%"></div>${i%3===0?`<div class="bar c" style="height:${Math.max(22,x-13)}%"></div>`:''}`).join('')}</div><div class="legend"><span><i></i>Production</span><span><i class="cons"></i>Consumption</span></div>`}
function overview(){return head('Energy Command Center','Vue globale du réseau CITYOS')+`<div class="cards">${card('Centrales','5')+card('Centrales PV','3')+card('Districts','15')+card('Cités','40')+card('Maisons','240')+card('Maisons PV','52')+card('Smart Meters','240')+card('Meters Online','232')+card('Production','148 MW')+card('Consumption','121 MW')}</div><div class="grid"><section class="panel"><div style="display:flex;justify-content:space-between"><h2>Production vs consommation</h2><div class="tabs"><button class="sel">24H</button><button>7D</button><button>30D</button></div></div>${bars()}</section><section class="panel"><h2>Active alerts <span style="color:var(--red)">7</span></h2>${alertRows()}</section><section class="panel"><h2>Global Energy Flow</h2><div class="flow"><div class="node">POWER PLANTS<b>148 MW</b></div><div class="arrow">→</div><div class="node">STEG GRID<b>82 MW import</b></div><div class="arrow">→</div><div class="node">DISTRICTS<b>121 MW</b></div><div class="arrow">→</div><div class="node">HOUSES<b>14 MW export</b></div></div></section><section class="panel"><h2>Solar Generation</h2><div class="detail"><div class="metric"><span class="label">Current PV</span><strong>63.3 MW</strong></div><div class="metric"><span class="label">Solar houses</span><strong>52</strong></div><div class="metric"><span class="label">Self consumption</span><strong>78%</strong></div></div><button class="btn" style="margin-top:18px" onclick="route('solar')">Open solar dashboard</button></section>`}
function alertRows(){return `<div class="alert"><span class="badge critical">CRITICAL</span><div><b>Communication loss</b><br><span class="label">SM-001248 · Cité Ennasr</span></div></div><div class="alert"><span class="badge high">HIGH</span><div><b>Inverter fault</b><br><span class="label">PV Centrale Sud · 12 min ago</span></div></div><div class="alert"><span class="badge medium">MEDIUM</span><div><b>High consumption</b><br><span class="label">District Tunis Nord</span></div></div>`}
function centrals(){return head('Power Plants','5 production assets · 3 solar plants')+`<section class="panel table-wrap"><table class="table"><thead><tr><th>Name</th><th>Type</th><th>Current power</th><th>Availability</th><th>Status</th></tr></thead><tbody>${plants.map(p=>`<tr onclick="route('central')"><td><b>${p[0]}</b><br><span class="label">${p[4]}</span></td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td><span class="status">● Operational</span></td></tr>`).join('')}</tbody></table></section><div class="grid"><section class="panel"><h2>Associated districts</h2><div class="buttons"><button class="btn ghost" onclick="route('district')">District Tunis Nord</button><button class="btn ghost">District Tunis Centre</button><button class="btn ghost">District Ariana</button><button class="btn ghost">District Ben Arous</button></div></section><section class="panel"><h2>Central Remote Control</h2>${controls('Centrale Tunis')}</section></div>`}
function central(){return head('Centrale Tunis','Thermal plant · Tunis')+`<div class="cards">${card('Installed power','180 MW')+card('Current power','148 MW')+card('Availability','94%')+card('Daily generation','2.4 GWh')+card('Active alerts','1')}</div><div class="grid"><section class="panel"><h2>Generation history</h2>${bars()}</section><section class="panel"><h2>Central Remote Control</h2>${controls('Centrale Tunis')}</section></div><section class="panel" style="margin-top:16px"><h2>Associated districts</h2><table class="table"><tbody><tr onclick="route('district')"><td><b>District Tunis Nord</b></td><td>42.6 MW consumption</td><td><span class="status">● Healthy</span></td></tr><tr><td><b>District Tunis Centre</b></td><td>38.1 MW consumption</td><td><span class="status">● Healthy</span></td></tr></tbody></table></section>`}
function district(){return head('District Tunis Nord','Linked to Centrale Tunis · 3,240 meters')+`<div class="cards">${card('Consumption','42.6 MW')+card('Local PV','8.3 MW')+card('STEG Import','29.4 MW')+card('Cités','4')+card('Alerts','3')}</div><div class="grid"><section class="panel"><h2>District load</h2>${bars()}</section><section class="panel"><h2>District Remote Control</h2>${controls('District Tunis Nord','3,240')}</section></div><section class="panel" style="margin-top:16px"><h2>Cités</h2><table class="table"><tbody><tr onclick="route('city')"><td><b>Cité El Amal</b></td><td>850 meters</td><td>12.2 MW</td><td><span class="status">● Normal</span></td></tr><tr><td><b>Cité Ennasr</b></td><td>720 meters</td><td>10.9 MW</td><td><span class="status off">● Attention</span></td></tr></tbody></table></section>`}
function city(){return head('Cité El Amal','District Tunis Nord · 850 meters')+`<div class="cards">${card('Houses','850')+card('PV houses','186')+card('Consumption','12.2 MW')+card('PV production','2.8 MW')+card('Alerts','1')}</div><div class="grid"><section class="panel"><h2>Local grid map</h2>${mapCanvas()}</section><section class="panel"><h2>City Remote Operations</h2>${controls('Cité El Amal','850')}</section></div><section class="panel" style="margin-top:16px"><h2>Houses</h2>${houseTable()}</section>`}
function houseList(){return head('Houses','240 monitored homes · filters shown for demonstration')+`<div class="buttons" style="margin-bottom:16px"><button class="btn ghost">All houses</button><button class="btn ghost">PV</button><button class="btn ghost">Online</button><button class="btn ghost">Offline</button><button class="btn ghost">High consumption</button><button class="btn ghost">Alerts</button></div><section class="panel">${houseTable()}</section>`}
function houseTable(){return `<div class="table-wrap"><table class="table"><thead><tr><th>House</th><th>City</th><th>Meter</th><th>PV</th><th>Consumption</th><th>PV prod.</th><th>Import</th><th>Export</th><th>Status</th></tr></thead><tbody>${houses.map((h,i)=>{let self=Math.min(h[4],h[5]),im=Math.max(0,h[4]-h[5]),ex=Math.max(0,h[5]-h[4]);return `<tr onclick="route('house',${i})"><td><b>${h[0]}</b></td><td>${h[1]}</td><td>${h[2]}</td><td>${h[3]?'☀ Yes':'—'}</td><td>${h[4]} kW</td><td>${h[5]} kW</td><td>${im.toFixed(1)} kW</td><td>${ex.toFixed(1)} kW</td><td><span class="status ${h[6]=='Offline'?'off':''}">● ${h[6]}</span></td></tr>`}).join('')}</tbody></table></div>`}
function house(i){let h=houses[i];let self=Math.min(h[4],h[5]),im=Math.max(0,h[4]-h[5]),ex=Math.max(0,h[5]-h[4]);return `<div class="crumb"><a onclick="route('overview')">Overview</a> / <a onclick="route('centrals')">Centrale Tunis</a> / <a onclick="route('district')">District Tunis Nord</a> / <a onclick="route('city')">Cité El Amal</a> / ${h[0]}</div><div class="heading"><div><h1>House ${h[0]}</h1><p>${h[1]} · District Tunis Nord · ${h[3]?'Solar PV 5.5 kWp':'No solar installation'}</p></div><button class="btn" onclick="route('meter')">Open Smart Meter</button></div><div class="cards">${card('Consumption',h[4]+' kW')+card('PV Production',h[5]+' kW')+card('Self Consumption',self.toFixed(1)+' kW')+card('Grid Import',im.toFixed(1)+' kW')+card('Grid Export',ex.toFixed(1)+' kW')}</div><div class="grid"><section class="panel"><h2>Current Energy Flow</h2><div class="flow"><div class="node">${h[3]?'SOLAR PV':'STEG GRID'}<b>${h[3]?h[5]+' kW':im+' kW'}</b></div><div class="arrow">→</div><div class="node">HOUSE<b>${h[4]} kW</b></div><div class="arrow">${ex?'→':'←'}</div><div class="node">STEG GRID<b>${ex?ex.toFixed(1)+' kW export':im.toFixed(1)+' kW import'}</b></div></div></section><section class="panel"><h2>Remote Control</h2>${controls('House '+h[0])}</section></div>`}
function meter(){return head('Smart Meter SM-001245','House M-001245 · Cité El Amal')+`<div class="cards">${card('Status','Online','Last communication: just now')+card('Voltage','231 V')+card('Current','8.4 A')+card('Active power','4.2 kW')+card('Frequency','50.0 Hz')}</div><div class="grid"><section class="panel"><h2>Energy measurements</h2><div class="detail"><div class="metric"><span class="label">Import Energy</span><strong>18.4 kWh</strong></div><div class="metric"><span class="label">Export Energy</span><strong>7.2 kWh</strong></div><div class="metric"><span class="label">Monthly Energy</span><strong>387 kWh</strong></div></div><h2 style="margin-top:22px">Meter Events</h2><div class="alert"><span class="badge medium">INFO</span><div><b>Profile synchronized</b><br><span class="label">Today, 14:18</span></div></div><p class="label">Prototype / Simulation / À valider avec STEG</p></section><section class="panel"><h2>Remote meter reading</h2><p class="label">All communication is simulated. No real grid action.</p><button class="btn" onclick="ask('Smart Meter SM-001245','Remote Read')">READ NOW</button><h2 style="margin-top:24px">Meter controls</h2>${controls('Smart Meter SM-001245')}</section></div>`}
function solar(){return head('Solar Energy','Centralized and distributed photovoltaic generation')+`<div class="cards">${card('Installed PV','94 MWp')+card('Current generation','63.3 MW')+card('Daily generation','488 MWh')+card('Monthly generation','10.8 GWh')+card('Grid export','14 MW')}</div><div class="grid"><section class="panel"><h2>PV generation — 24H</h2>${bars()}</section><section class="panel"><h2>Solar plants</h2>${pvPlants.map(x=>`<div class="alert"><span class="badge medium">PV</span><div><b>${x[0]}</b><br><span class="label">${x[1]} installed · ${x[2]} current · ${x[3]} yield</span></div></div>`).join('')}</section></div>`}
function mapCanvas(){return `<div class="map"><span class="marker" style="left:47%;top:35%" title="Centrale Tunis"></span><span class="marker pv" style="left:62%;top:46%" title="PV asset"></span><span class="marker" style="left:38%;top:65%" title="House M-001245" onclick="route('house',0)"></span><span class="marker alertm" style="left:72%;top:72%" title="Alert"></span></div>`}function map(){return head('Grid Map','GIS simulation · Coordinates are fictitious')+`<div class="buttons" style="margin-bottom:15px"><button class="btn ghost">All assets</button><button class="btn ghost">Solar Assets</button><button class="btn ghost">Houses</button><button class="btn ghost">Alerts</button></div><section class="panel">${mapCanvas()}<p class="label">Click the markers to inspect simulated assets. Zoom levels: plants → districts → cities → houses → meters.</p></section>`}
function alerts(){return head('Alert Center','7 active events requiring review')+`<div class="buttons" style="margin-bottom:16px"><button class="btn ghost">All levels</button><button class="btn ghost">Critical</button><button class="btn ghost">High</button><button class="btn ghost">Open</button></div><section class="panel">${alertRows()}<div class="alert"><span class="badge medium">MEDIUM</span><div><b>Voltage anomaly</b><br><span class="label">House M-001203 · District Tunis Centre</span></div></div><div class="alert"><span class="badge high">HIGH</span><div><b>Over power</b><br><span class="label">Feeder F-17 · Cité El Amal</span></div></div></section>`}
function controls(t,affected='1'){return `<div class="buttons">${['Request Status','Remote Read','Diagnostics','Synchronize','Configuration','Load Limit','Reconnect','Disconnect','Reset'].map(x=>`<button class="btn ghost" onclick="ask('${t}','${x}','${affected}')">${x}</button>`).join('')}</div><p class="label" style="margin-top:15px">Simulation only — no real grid action.</p>`}
function control(){return head('Remote Control','Simulated control engine for every hierarchy level')+`<div class="grid"><section class="panel"><h2>Select target</h2><div class="buttons"><button class="btn ghost" onclick="route('central')">Central</button><button class="btn ghost" onclick="route('district')">District</button><button class="btn ghost" onclick="route('city')">City</button><button class="btn ghost" onclick="route('house',0)">House</button><button class="btn ghost" onclick="route('meter')">Meter</button></div></section><section class="panel"><h2>Control safeguards</h2><p class="label">Role: Operator · Sensitive operations require confirmation and are recorded in the Operations Log.</p></section></div>`}
function ops(){return head('Operations Log','Simulated commands and responses')+`<section class="panel table-wrap"><table class="table"><thead><tr><th>Time</th><th>User</th><th>Target</th><th>Command</th><th>Status</th><th>Response</th></tr></thead><tbody>${operations.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td><span class="status">● ${x[4]}</span></td><td>Simulation command — no real grid action</td></tr>`).join('')}</tbody></table></section>`}
function ask(t,c,a='1'){target=t;command=c;document.getElementById('modalTitle').textContent='Confirm simulation';document.getElementById('modalText').textContent=`You are about to simulate “${c}” for ${t}. This action will affect ${a} meter${a==='1'?'':'s'}. No real grid action will be performed.`;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function confirmCommand(){closeModal();let now=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});operations.unshift([now,'Operator',target,command,'Success']);let toast=document.getElementById('toast');toast.textContent=`${command} dispatched successfully. Simulation only.`;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3500);if(command==='Remote Read')setTimeout(()=>route('meter'),400)}function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,1000);route('overview');
</script></body></html>
